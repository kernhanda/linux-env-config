# herdr configuration. Full reference: `herdr --default-config`.

onboarding = false

[terminal]
# Spawn zsh directly. Reaching zsh via $SHELL (bash) leaves it a child of the
# pane's shell, and `herdr agent start` then rejects the pane as
# agent_pane_busy because the foreground pid is not the pane's own shell.
default_shell = "zsh"

[keys]
# Prefix-free ctrl+alt chords; the prefix bindings keep working alongside.
focus_pane_left   = ["prefix+h", "ctrl+alt+h"]
focus_pane_down   = ["prefix+j", "ctrl+alt+j"]
focus_pane_up     = ["prefix+k", "ctrl+alt+k"]
focus_pane_right  = ["prefix+l", "ctrl+alt+l"]
previous_tab      = ["prefix+p", "ctrl+alt+["]
next_tab          = ["prefix+n", "ctrl+alt+]"]
new_tab           = ["prefix+c", "ctrl+alt+c"]
rename_tab        = "prefix+shift+t"
split_vertical    = ["prefix+\\", "ctrl+alt+d"]
split_horizontal  = ["prefix+minus", "ctrl+alt+shift+d"]
zoom              = ["prefix+z", "ctrl+alt+z"]
# Agent cycling follows the agent panel's ordering.
previous_agent = "prefix+shift+a"
next_agent     = "prefix+a"
focus_agent    = "prefix+alt+1..9"

# herdr-navigator: fuzzy jump over workspaces, agents, sessions, and actions.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[ui]
mouse_capture = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false

[ui.sound]
# Headless EC2 host: no audio players, every state-change sound fails.
enabled = false
