# Tmux settings

unbind C-l

unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

set-option -g history-limit 9000

set -g renumber-windows on

bind Space last-window

# Set XTerm key bindings
setw -g xterm-keys on

# Set colors. The outer tmux's TERM is what the inner one inherits over ssh, so
# this choice decides whether italics/undercurl survive the hop. Guarded because
# minimal hosts don't always ship the tmux-256color entry.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*:Tc"
if-shell -b 'tmux -V | grep -qE "^tmux (3\.[2-9]|[4-9])"' 'set -ga terminal-features ",*:RGB"'

# Configure escape vim for Neovim.
# https://github.com/neovim/neovim/wiki/FAQ#esc-in-tmux-or-gnu-screen-is-delayed
set-option -sg escape-time 10

# Set reload key to r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Count sessions start at 1
set -g base-index 1

# Enable focus-events to enable vim to refresh accordingly.
set-option -g focus-events on

# Use vim bindings
setw -g mode-keys vi

# Enable mouse in tmux.  Note that this will interfere with mouse selection.
# In iterm2, hold down opt to enable normal mouse selection while mouse mode
# is on in tmux.
# set -g mouse on

# Remap window navigation to vim
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# Resize the current pane using Alt + direction
bind -n M-k resize-pane -U
bind -n M-j resize-pane -D
bind -n M-h resize-pane -L
bind -n M-l resize-pane -R

# Open new panes and windows in current directory.
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind c new-window -c '#{pane_current_path}'

# Tmux statusbar config (created by tmuxline.vim)
set -g status-justify "left"
set -g status "on"
set -g status-style "none"
set -g message-command-style "bg=colour31"
set -g status-left-length "100"
set -g pane-active-border-style "fg=colour254"
set -g status-bg "colour234"
set -g message-command-style "fg=colour231"
set -g pane-border-style "fg=colour240"
set -g message-style "bg=colour31"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-right-length "100"
set -g message-style "fg=colour231"
setw -g window-status-style "fg=colour250,bg=colour234,none"
setw -g window-status-activity-style "fg=colour250,bg=colour234,none"
setw -g window-status-separator ""
##
set -g status-left "#[fg=colour16,bg=colour254,bold] #S #[fg=colour254,bg=colour234,nobold,nounderscore,noitalics]"
##
set -g status-right "#[fg=colour236,bg=colour234,nobold,nounderscore,noitalics]#[fg=colour247,bg=colour236] %Y-%m-%d  %l:%M %p #[fg=colour252,bg=colour236,nobold,nounderscore,noitalics]#[fg=colour235,bg=colour252] #H "
setw -g window-status-format "#[fg=colour244,bg=colour234] #I #[fg=colour250,bg=colour234] #W#{?window_zoomed_flag,[Z],} "
setw -g window-status-current-format "#[fg=colour234,bg=colour31,nobold,nounderscore,noitalics]#[fg=colour117,bg=colour31] #I #[fg=colour231,bg=colour31,bold] #W#{?window_zoomed_flag,[Z],} #[fg=colour31,bg=colour234,nobold,nounderscore,noitalics]"
# end tmux statusbar config

set-option -g set-titles on
set-option -g set-titles-string "#S / #H"

################################################################################
# Nested sessions (host tmux + one remote inner session)
################################################################################

# Both transitions live in aliases so the F12 bindings and the ssh wrapper in
# .zshrc drive one definition. Session-scoped sets on purpose: host-mode's
# `set -u` falls back to the globals above, so a reload can't strand the prefix
# on C-b.
set -s command-alias[100] 'pass-mode=set prefix None ; set key-table off ; set status-style "fg=colour245,bg=colour238" ; set status-left "#[fg=colour238,bg=colour245,bold] #S ⇣ #[fg=colour245,bg=colour234,nobold,nounderscore,noitalics]" ; set window-status-current-format "#[fg=colour245,bg=colour238] #I #[fg=colour250,bg=colour238,bold] #W " ; refresh-client -S'
set -s command-alias[101] 'host-mode=set -u prefix ; set -u key-table ; set -u status-style ; set -u status-left ; set -u window-status-current-format ; refresh-client -S'

# F12 enables host mode — grabs the keyboard back from the inner session.
bind -T off F12 host-mode \; display-message " HOST "

# F12 again hands it back down. Refuses when the pane holds no ssh, so a
# local-only session can't be left without a prefix. A stopped ssh (C-z) fails
# the state check, which is the point.
is_ssh="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(ssh|mosh-client)$'"
bind -T root F12 if-shell "$is_ssh" \
  'if -F "#{pane_in_mode}" "send-keys -X cancel" ; pass-mode' \
  'display-message "no ssh in this pane - host mode stays on"'

# Remote servers get an amber badge so the two stacked bars are never ambiguous.
# Read at server start; on a remote the server is spawned from the ssh login
# shell, so SSH_CONNECTION is set.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g status-left "#[fg=colour16,bg=colour215,bold] #S #[fg=colour215,bg=colour234,nobold,nounderscore,noitalics]" ; \
   set -g pane-active-border-style "fg=colour215"'

